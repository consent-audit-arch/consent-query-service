server:
  port: 8080

spring:
  application:
    name: consent_query_service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/tcc}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/tcc/protocol/openid-connect/certs}

base-url: /api/v1/consent

tcc:
  security:
    enabled: true
    opa:
      enabled: true
      url: ${OPA_URL:http://localhost:8181/v1/data/consent-query/authz/decision}
      timeout: 2s
    pip:
      url: ${PIP_URL:http://consent-query-service:8080/api/v1/consent}
    headers:
      purpose: X-Purpose
      data-subject-id: X-Data-Subject-Id
      data-subject-ids: X-Data-Subject-Ids
      data-categories: X-Data-Categories
      correlation-id: X-Correlation-Id
